name: P1 verification

on:
  push:
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      MPLCONFIGDIR: ${{ github.workspace }}/.matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Regression tests and real-model pipeline smoke
        run: python -B -m unittest discover -s tests -v
      - name: Read-only preserved-output consistency
        run: python -B scripts/check_saved_outputs.py
      - name: Read-only supplementary rolling-control replay
        run: python -B scripts/check_rolling_control.py
