[project]
name = "energy-forecasting-under-regime-shift"
version = "1.0.0"
description = "Probabilistic electricity-price forecasting with conformal calibration under regime shift"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
